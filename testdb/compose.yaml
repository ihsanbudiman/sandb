name: sandb-test

# Throwaway test databases for sandb. Data lives on tmpfs, so `down` leaves nothing behind.
# Healthchecks connect over TCP on purpose: during init the images run a temporary
# server without TCP, so a TCP login of sandb_ro (created by the last seed script)
# only passes after all seed scripts have finished.
# The Mongo services listen on the same port inside and outside the container, so the
# replica set member address (127.0.0.1:${MONGO_RS_PORT}) also works from the host.

x-pg: &pg
  env_file: .env.test
  networks: [testnet]
  volumes:
    - ./seed/pg:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres && PGPASSWORD=$$SANDB_RO_PASSWORD psql -h 127.0.0.1 -U sandb_ro -d shop_staging -tAc 'SELECT count(*) FROM analytics.events' | grep -q 10000"]
    interval: 2s
    timeout: 5s
    retries: 90
    start_period: 5s

x-mongo: &mongo
  image: mongo:8
  env_file: .env.test
  networks: [testnet]
  tmpfs: [/data/db, /data/configdb]
  volumes:
    - ./seed/mongo:/docker-entrypoint-initdb.d:ro

services:
  pg16:
    <<: *pg
    image: postgres:16
    ports: ["127.0.0.1:${PG16_PORT}:5432"]
    tmpfs: [/var/lib/postgresql/data]

  pg13:
    <<: *pg
    image: postgres:13
    ports: ["127.0.0.1:${PG13_PORT}:5432"]
    tmpfs: [/var/lib/postgresql/data]

  mysql:
    image: mysql:8.4
    env_file: .env.test
    networks: [testnet]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-use-native-aio=0"]
    ports: ["127.0.0.1:${MYSQL_PORT}:3306"]
    tmpfs: [/var/lib/mysql]
    volumes:
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent && mysql -h 127.0.0.1 -usandb_ro -p$$SANDB_RO_PASSWORD -Nse 'SELECT count(*) FROM analytics.events' | grep -q 10000"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  mariadb:
    image: mariadb:11
    env_file: .env.test
    networks: [testnet]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-use-native-aio=0"]
    ports: ["127.0.0.1:${MARIADB_PORT}:3306"]
    tmpfs: [/var/lib/mysql]
    volumes:
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized && mariadb -h 127.0.0.1 -usandb_ro -p$$SANDB_RO_PASSWORD -Nse 'SELECT count(*) FROM analytics.events' | grep -q 10000"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  # One-node replica set: transactions work. A replica set with auth needs a key file;
  # the wrapper makes a throwaway one. The healthcheck initiates the set (the init
  # scripts run on a temporary server without --replSet), then logs in as sandb_ro.
  mongo-rs:
    <<: *mongo
    entrypoint:
      - bash
      - -c
      - openssl rand -base64 756 > /tmp/rs.key && chmod 400 /tmp/rs.key && chown mongodb:mongodb /tmp/rs.key && exec docker-entrypoint.sh mongod --port ${MONGO_RS_PORT} --replSet rs0 --keyFile /tmp/rs.key
    ports: ["127.0.0.1:${MONGO_RS_PORT}:${MONGO_RS_PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGO_RS_PORT} -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"127.0.0.1:${MONGO_RS_PORT}\" }] }) }' >/dev/null && mongosh --quiet 'mongodb://sandb_ro:'$$SANDB_RO_PASSWORD'@127.0.0.1:${MONGO_RS_PORT}/analytics?authSource=admin&directConnection=true' --eval 'db.events.countDocuments()' | grep -q 10000"]
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 20s

  # Standalone server: no transactions.
  mongo-standalone:
    <<: *mongo
    command: ["mongod", "--port", "${MONGO_STANDALONE_PORT}"]
    ports: ["127.0.0.1:${MONGO_STANDALONE_PORT}:${MONGO_STANDALONE_PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet 'mongodb://sandb_ro:'$$SANDB_RO_PASSWORD'@127.0.0.1:${MONGO_STANDALONE_PORT}/analytics?authSource=admin' --eval 'db.events.countDocuments()' | grep -q 10000"]
      interval: 2s
      timeout: 10s
      retries: 90
      start_period: 20s

  mock-llm:
    image: node:22-alpine
    env_file: .env.test
    environment:
      HOST: 0.0.0.0
      PORT: "${MOCK_LLM_PORT}"
    networks: [testnet]
    command: ["node", "/app/server.mjs"]
    ports: ["127.0.0.1:${MOCK_LLM_PORT}:${MOCK_LLM_PORT}"]
    volumes:
      - ./mock-llm:/app:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MOCK_LLM_PORT}/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  testnet: {}
