name: Release

# Manual only. The normal path is local: pnpm release:local (scripts/release.sh), see docs/RELEASING.md.
# To use this workflow, run it from the Actions tab with a tag such as v0.2.0 as the ref.
# It builds the macOS app and publishes a GitHub Release.
# The release includes latest.json, which installed apps read to find updates.
# Both macOS architectures are built: Apple Silicon (arm64) and Intel (x86_64).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # Apple Silicon runner; the Intel target is cross-compiled
    strategy:
      fail-fast: false
      # One architecture at a time: both jobs write to the same release and
      # merge their entry into latest.json, so they must not run in parallel.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: Apple Silicon
          - target: x86_64-apple-darwin
            arch: Intel
    name: release (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      # The CHANGELOG.md section of this version becomes the release notes on GitHub
      # and in latest.json, which the app shows when it finds the update.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$v" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md | sed '/./,$!d')
          [ -n "$notes" ] || { echo "CHANGELOG.md has no section ## [$v]"; exit 1; }
          { echo 'body<<CHANGELOG_EOF'; echo "$notes"; echo 'CHANGELOG_EOF'; } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Self-signed certificate. A fixed signature lets macOS keep the Keychain "Always Allow"
      # permission across updates. Tauri's APPLE_CERTIFICATE import only accepts Apple
      # certificates, so this step imports it and tauri-action gets only APPLE_SIGNING_IDENTITY.
      - name: Import code signing certificate
        env:
          MACOS_CODESIGN_CERTIFICATE: ${{ secrets.MACOS_CODESIGN_CERTIFICATE }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(openssl rand -base64 24)
          echo "$MACOS_CODESIGN_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -f pkcs12 -k "$kc" -P "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: sandb Code Signing
        with:
          tagName: ${{ github.ref_name }}
          releaseName: sandb ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
